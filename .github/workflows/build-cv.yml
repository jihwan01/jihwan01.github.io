name: Build CV

on:
  push:
    branches: [master]
    paths:
      - "cv/**"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: cv
          latexmk_use_xelatex: true

      - name: Publish PDF
        run: |
          mkdir -p files
          cp cv/main.pdf files/CV_JihwanOh.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/CV_JihwanOh.pdf
          if git diff --cached --quiet; then
            echo "CV PDF is already current."
          else
            git commit -m "Update generated CV PDF"
            git push
          fi
